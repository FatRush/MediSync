<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <!-- Botón para regresar al login -->
      <ion-back-button defaultHref="/login" text="Atrás"></ion-back-button>
    </ion-buttons>
    <ion-title>Recuperar Contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="header-text ion-text-center">
    <h2>¿Olvidaste tu contraseña?</h2>
    <p class="ion-padding-horizontal text-muted">
      Ingresa tu correo electrónico y te enviaremos un enlace para que puedas crear una nueva.
    </p>
  </div>

  <ion-list class="ion-margin-top">
    <ion-item class="custom-input">
      <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
      <ion-input 
        [(ngModel)]="email" 
        type="email" 
        label="Correo electrónico" 
        labelPlacement="floating" 
        placeholder="ejemplo@correo.com">
      </ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" class="ion-margin-top" (click)="resetPassword()">
    Enviar enlace de recuperación
  </ion-button>
</ion-content>
