<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Administración de Secretarias</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Botón para agregar nueva secretaria -->
  <ion-button expand="block" color="success" class="ion-margin-bottom" (click)="abrirFormularioSecretaria()">
    <ion-icon slot="start" name="person-add-outline"></ion-icon>
    Registrar Nueva Secretaria
  </ion-button>

  <h2>Lista de Secretarias</h2>

  <div *ngIf="cargando" class="ion-text-center">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div *ngIf="!cargando && secretarias.length === 0" class="ion-text-center ion-padding">
    <p style="color: #666;">No hay secretarias registradas todavía.</p>
  </div>

  <!-- Tarjetas de Secretarias -->
  <ion-card *ngFor="let sec of secretarias">
    <ion-card-content>
      <h3><b>Nombre:</b> {{ sec.nombre }}</h3>
      <p><b>Correo:</b> {{ sec.correo }}</p>
      <p><b>Clínica asignada:</b> <span style="color: var(--ion-color-primary);">{{ sec.clinicaNombre || 'No asignada' }}</span></p>

      <!-- Botones de Editar y Eliminar (CRUD) -->
      <div class="ion-margin-top" style="display: flex; gap: 10px;">
        <ion-button size="small" fill="outline" color="primary" (click)="abrirFormularioSecretaria(sec)">
          <ion-icon slot="start" name="create-outline"></ion-icon>
          Editar
        </ion-button>

        <ion-button size="small" fill="outline" color="danger" (click)="eliminarSecretaria(sec.id)">
          <ion-icon slot="start" name="trash-outline"></ion-icon>
          Eliminar
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
